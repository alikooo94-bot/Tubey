name: Build APK
on:
  push:
  workflow_dispatch:
env:
  # معرّف تطبيق AdMob. الافتراضي هو معرّف Google التجريبي (آمن للتجربة).
  # للنشر: أضف متغيراً باسم ADMOB_APP_ID في Settings > Secrets and variables > Actions > Variables
  ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Portrait + AdMob app id + permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' $M
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' $M
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: tubey-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
