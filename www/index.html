<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tubey</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--panel:rgba(255,255,255,.14);--edge:rgba(255,255,255,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1238;color:var(--ink);font-family:Tajawal,system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{display:flex;flex-direction:column}
.hud{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px 0}
.hud .mid{text-align:center;line-height:1.1}
.hud .mid{white-space:nowrap}
.hud .mid b{font-size:17px;display:block}
.hud .mid small{opacity:.75;font-size:12px}
.btn{position:relative;background:var(--panel);color:var(--ink);border:1.5px solid var(--edge);border-radius:14px;width:46px;height:46px;font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}
.btn:active{transform:scale(.92)}
.btn i{position:absolute;top:-6px;right:-6px;background:#ff5d8f;border-radius:10px;font:700 11px system-ui;padding:2px 6px;font-style:normal}
.btn.off{opacity:.4}
.btn{width:42px;height:42px;font-size:18px}
.ov{z-index:5;position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,5,30,.55);backdrop-filter:blur(4px)}.ov.show{display:flex}
.row{display:flex;align-items:center;gap:10px;padding:6px 12px 0;min-height:42px}#chip{font-weight:700;font-size:15px}
#home{background:rgba(15,8,40,.72);backdrop-filter:blur(8px)}
.hm{text-align:center}.sub{opacity:.8;margin:4px 0 18px;font-weight:700}
.logo{font-size:64px;letter-spacing:1px;font-weight:800;line-height:1.05;background:linear-gradient(135deg,#ffe27a,#ff6b9d,#7df9ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;animation:flt 3s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px)}}
.tb.big{display:block;width:240px;margin:8px auto}
.hm{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(340px,88vw);text-align:center}
.hm .logo,.hm .sub,#bPlay,#bDay,#bSet{grid-column:1/-1}
.hm .sub{margin:0 0 6px}
#bPlay{display:flex;align-items:center;justify-content:center;gap:10px;font-family:Tajawal,system-ui,sans-serif;font-size:22px;padding:16px 20px;border-radius:22px;box-shadow:0 10px 30px rgba(255,90,100,.45);animation:pls 2.6s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.035)}}
.hm .tb.big{width:auto;margin:0;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(10px);font:800 17px Tajawal,system-ui,sans-serif;text-align:right;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hm .tb.big:active{transform:scale(.97)}
.hm .tb.big svg{flex:none;box-sizing:content-box;padding:8px;border-radius:14px;background:rgba(255,255,255,.14)}
#bDay svg{background:linear-gradient(135deg,#ffb703,#ff4d6d)!important}
#bThm,#bAch{flex-direction:column;justify-content:center;text-align:center!important;padding:16px 8px!important;gap:8px!important}
#sl .tb.big{width:280px;margin:6px auto;border-radius:16px;padding:13px 16px;background:rgba(255,255,255,.12);font-family:Tajawal,system-ui,sans-serif}
#tut{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%) translateY(30px);opacity:0;background:rgba(20,10,50,.9);border:1.5px solid var(--edge);padding:12px 18px;border-radius:18px;font-weight:800;z-index:3;max-width:86%;text-align:center;transition:.3s;pointer-events:none}#tut.show{opacity:1;transform:translateX(-50%)}
.btn svg{display:block;margin:auto}
.ar{display:flex;gap:10px;align-items:center;padding:8px 12px;margin:6px 0;border-radius:12px;background:var(--panel);text-align:right;font-weight:800}.ar.lock{opacity:.45}.ar small{display:block;font-weight:500;opacity:.8}
#al{max-height:50vh;overflow:auto;width:300px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%) translateY(-140px);background:linear-gradient(135deg,#ffb703,#ff4d6d);color:#fff;font-weight:800;padding:10px 18px;border-radius:24px;z-index:9;transition:transform .4s;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap}#toast.show{transform:translateX(-50%) translateY(0)}
#tl{max-width:320px;max-height:55vh;overflow:auto}
.tb{display:inline-block;margin:4px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--edge);background:var(--panel);color:#fff;font:700 16px system-ui;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#top{position:relative;z-index:2;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0));padding-bottom:6px}
#win{z-index:5;position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,5,30,.55);backdrop-filter:blur(4px)}
#win.show{display:flex}
.card{background:linear-gradient(160deg,#3b2a78,#5b3aa5);border:1.5px solid var(--edge);border-radius:24px;padding:26px 34px;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.card h2{margin:0 0 6px;font-size:26px}.stars{font-size:40px;letter-spacing:6px;margin:6px 0 14px}
.go{background:linear-gradient(135deg,#ffb703,#ff4d6d);border:0;color:#fff;font:800 18px system-ui;padding:12px 30px;border-radius:30px;cursor:pointer}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="top"><div class="hud">
  <button class="btn" id="bUndo" title="تراجع">↩</button>
  <button class="btn" id="bHint" title="تلميح">💡<i id="hc">3</i></button>
  <div class="mid"><b>المستوى <span id="lv">1</span></b><small>الحركات: <span id="mv">0</span></small></div>
  <button class="btn" id="bAdd" title="أنبوب إضافي">＋</button>
  <button class="btn" id="bRs" title="إعادة">⟲</button>
  <button class="btn" id="bSnd" title="الصوت">🔊</button>
</div>
<div class="row"><button class="btn" id="bHome" title="الرئيسية"></button><button class="btn" id="bTh" title="الثيمة">🎨</button><button class="btn" id="bCb" title="رموز الألوان">👁</button><span id="chip"></span></div>
</div>
<canvas id="cv"></canvas>
<div id="lose" class="ov"><div class="card"><h2 id="lm"></h2><button class="tb big" id="bSecond" style="display:none"></button><button class="go" id="retry">إعادة المحاولة</button></div></div>
<div id="home" class="ov show"><div class="hm"><div class="logo">Tubey</div><div class="sub" id="hl"></div><button class="go" id="bPlay">العب ▶</button><button class="tb big" id="bDay"></button><button class="tb big" id="bThm">الثيمات</button><button class="tb big" id="bAch"></button><button class="tb big" id="bSet">الإعدادات</button></div></div>
<div id="set" class="ov"><div class="card"><h2>الإعدادات</h2><div id="sl"></div><button class="go" id="sx" style="margin-top:12px">رجوع</button></div></div>
<div id="toast"></div><div id="tut"></div>
<div id="ach" class="ov"><div class="card"><h2>الإنجازات</h2><div id="al"></div><button class="go" id="ax" style="margin-top:12px">رجوع</button></div></div>
<div id="menu" class="ov"><div class="card"><h2>اختر الثيمة</h2><div id="tl"></div></div></div>
<div id="win"><div class="card"><h2>🎉 أحسنت!</h2><div id="st" class="stars"></div><div id="wm" style="opacity:.8;margin-bottom:14px"></div><button class="tb big" id="bShare">📤 مشاركة النتيجة</button><button class="go" id="next">المستوى التالي</button></div></div>
<script>
const CAP=4, MAXC=9;
const HUES=[[350,85,60],[24,95,56],[50,95,55],[100,60,52],[170,70,44],[195,85,55],[225,80,64],[275,65,62],[320,75,66]];
const THEMES=[["#1b1238","#3a1d6e"],["#06283d","#0b5d6b"],["#3a0f2e","#7a2152"],["#10261c","#2a6b46"],["#2b1a0a","#8a4a16"]];
const cv=document.getElementById("cv");let g=cv.getContext("2d");const G0=g;
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,level=1,tubes=[],start=[],hist=[],moves=0,sel=-1,hints=3,added=false,sound=true;
let flights=[],parts=[],pending=[],lift=[],done=[],hint=null,won=false,t0=0,blobs=[],geo=[];
try{level=parseInt(localStorage.getItem("bs_level"))||1}catch(e){}
for(let i=0;i<14;i++)blobs.push({x:Math.random(),y:Math.random(),r:30+Math.random()*80,s:.02+Math.random()*.04,p:Math.random()*6});

/* ---------- audio ---------- */
let ac=null;function unlockAudio(){if(ac&&ac.state==="running")return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0)}catch(e){}}
function tone(f,d=.1,type="sine",v=.07){if(!sound)return;try{unlockAudio();
const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(v*1.7,ac.currentTime);
gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ---------- level ---------- */
function newLevel(keep){
  won=false;$("win").classList.remove("show");
  if(!keep){
    const n=Math.min(3+Math.floor((level-1)/2),(level>=12&&level%3===0)?7:MAXC);
    let b=[];for(let c=0;c<n;c++)for(let i=0;i<CAP;i++)b.push(c);
    const _mr=Math.random;if(daily)Math.random=daily.rng;let tries=0,ne=(level>=12&&level%3===0)?1:2;solPath=null;do{for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}
      tubes=[];for(let t=0;t<n;t++)tubes.push(b.slice(t*CAP,t*CAP+CAP));
    for(let e=0;e<ne;e++)tubes.push([]);}while(tubes.slice(0,n).some(t=>t.every(x=>x===t[0]))||(tries++<(ne===1?60:40)&&!(solPath=solve(tubes,ne===1?8000:30000))));tubes.length=n;
    tubes.push([],[]);
    Math.random=_mr;hardLv=ne===1&&!!solPath;if(hardLv)tubes.pop();start=tubes.map(t=>[...t]);
  }else tubes=start.map(t=>[...t]);
  hist=[];hintU=0;undoU=0;moves=0;sel=-1;hints=3;added=false;flights=[];hint=null;
  const nc=start.length-2;mode=level%5===0?"m":(level%5===3?"t":null);limit=nc*5+6;tleft=nc*14+30;failed=false;$("lose").classList.remove("show");fade=1;secU=0;for(const k in fl)delete fl[k];for(const k in lcol)delete lcol[k];initRev();tutInit();
  pending=tubes.map(()=>0);lift=tubes.map(()=>0);done=tubes.map(()=>false);
  try{if(!daily)localStorage.setItem("bs_level",level)}catch(e){}
  ui();layout();
}
function ui(){$("lv").textContent=daily?"اليومي "+icon():level+" "+icon();chip();$("mv").textContent=moves;$("hc").textContent=hints>0?hints:(AD()?"📺":0);$("bSnd").classList.toggle("off",!sound)}

/* ---------- layout ---------- */
function layout(){
  dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  const n=tubes.length,rows=n>4?2:1,cols=Math.ceil(n/rows);
  const TP=document.getElementById("top").getBoundingClientRect().bottom,HH=H-TP-56-adPad;const tw=Math.min(74,(W-24)/cols-14,(((HH-24-(rows-1)*30)/rows-22)/CAP-4)/.78),r=tw*.39,slot=r*2+4,th=CAP*slot+22;
  const gapY=Math.max(30,Math.min(60,(HH-rows*th)/(rows+1)));
  const totalH=rows*th+(rows-1)*gapY,top0=TP+(HH-totalH)/2+22;
  geo=tubes.map((_,i)=>{const row=rows===1?0:(i<cols?0:1),c=rows===1?i:(row?i-cols:i);
    const inRow=row?n-cols:Math.min(cols,n);
    return{x:W/2+(c-(inRow-1)/2)*(tw+14),y:top0+row*(th+gapY),tw,th,r,slot}});
}
const slotPos=(i,k)=>{const q=geo[i];return[q.x,q.y+q.th-11-q.slot*(k+.5)]};

/* ---------- rules ---------- */
const runLen=t=>{let k=0;while(k<t.length&&t[t.length-1-k]===t[t.length-1])k++;return k};
const canMove=(s,d)=>s!==d&&tubes[s].length&&tubes[d].length<CAP&&(!tubes[d].length||tubes[d][tubes[d].length-1]===tubes[s][tubes[s].length-1]);
function doMove(s,d,record=true){
  if(record)hist.push({t:tubes.map(x=>[...x]),r:rev.map(x=>[...x]),m:moves});
  const c=tubes[s][tubes[s].length-1],k=Math.min(runLen(tubes[s]),CAP-tubes[d].length),dl=tubes[d].length,sl=tubes[s].length;
  for(let j=0;j<k;j++){tubes[s].pop();tubes[d].push(c)}
  pending[d]+=k;moves++;revMove(s,d,k);
  for(let j=0;j<k;j++){const from=slotPos(s,sl-1-j);from[1]-=geo[s].slot*.55*lift[s];const to=slotPos(d,dl+j);
    flights.push({c,from,to,d,j,t:-j*.07,dur:.4,s,hi:Math.min(geo[s].y,geo[d].y)-34});}
  ui();
}
function tap(i){
  if(won||failed||flights.length)return;hint=null;
  if(sel===-1){if(tubes[i].length&&!done[i]){sel=i;tone(520,.06)}return}
  if(sel===i){sel=-1;tone(380,.05);return}
  if(canMove(sel,i)){const s=sel;sel=-1;doMove(s,i)}else{tone(150,.12,"square",.04);buzz(20);sel=tubes[i].length&&!done[i]?i:-1}
}
function findHint(){
  let best=null,bs=-1;
  for(let s=0;s<tubes.length;s++)for(let d=0;d<tubes.length;d++){
    if(done[s]||!canMove(s,d))continue;
    const S=tubes[s],uni=S.every(x=>x===S[0]);
    if(uni&&!tubes[d].length)continue;
    let sc=tubes[d].length?10+tubes[d].length*2+runLen(S):1;
    if(uni)sc+=5;if(sc>bs){bs=sc;best={s,d}}
  }return best;
}

/* ---------- particles ---------- */
function burst(x,y,n,spd=220){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=spd*(.3+Math.random());
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,l:1,c:HUES[Math.random()*MAXC|0],s:3+Math.random()*4})}}
function confetti(){for(let i=0;i<110;i++)parts.push({x:Math.random()*W,y:-10-Math.random()*H*.4,vx:(Math.random()-.5)*80,vy:80+Math.random()*180,l:2.2,c:HUES[Math.random()*MAXC|0],s:4+Math.random()*5,g:1})}

/* ---------- drawing ---------- */
const GEMS=[["#ff5a78","#9b0f31"],["#5b8cff","#16308f"],["#3be08a","#0b6b3a"],["#c07bff","#5a1d96"],["#ffd54a","#c46a00"],["#e8fbff","#7fc9e8"],["#6ff0ff","#0a7f9c"],["#ff9ad5","#b01f78"],["#ffb15a","#b5440a"]];
const SH=[
 [...Array(8)].map((_,i)=>[Math.cos(i*.7854+.3927)*.95,Math.sin(i*.7854+.3927)*.95]),
 [...Array(10)].map((_,i)=>[Math.cos(i*.6283)*.72,Math.sin(i*.6283)*.98]),
 [[-.45,-.95],[.45,-.95],[.82,-.55],[.82,.55],[.45,.95],[-.45,.95],[-.82,.55],[-.82,-.55]],
 [...Array(6)].map((_,i)=>[Math.cos(i*1.0472-1.5708)*.97,Math.sin(i*1.0472-1.5708)*.97]),
 [[0,-1],[.78,0],[0,1],[-.78,0]],
 [[-.55,-.8],[.55,-.8],[.97,-.25],[0,.98],[-.97,-.25]],
 [[0,-.98],[.98,.72],[-.98,.72]],
 [[0,-1],[.5,-.5],[.82,.1],[.66,.66],[0,.96],[-.66,.66],[-.82,.1],[-.5,-.5]],
 [...Array(5)].map((_,i)=>[Math.cos(i*1.2566-1.5708)*.97,Math.sin(i*1.2566-1.5708)*.97])
];
function gem(x,y,r,type,sq=1){
  g.save();g.translate(x,y);g.scale(1/sq,sq);
  const k=type%9,R=r*1.12,P=SH[k].map(p=>[p[0]*R,p[1]*R]),I=P.map(p=>[p[0]*.5,p[1]*.5]),c=GEMS[k],n=P.length;
  const path=a=>{g.beginPath();a.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()};
  const lg=g.createLinearGradient(-R,-R,R,R);lg.addColorStop(0,c[0]);lg.addColorStop(1,c[1]);
  g.lineJoin="round";g.shadowColor="rgba(0,0,0,.4)";g.shadowBlur=7;g.shadowOffsetY=2;
  path(P);g.fillStyle=lg;g.fill();g.shadowColor="transparent";
  for(let i=0;i<n;i++){const j=(i+1)%n;g.beginPath();g.moveTo(P[i][0],P[i][1]);g.lineTo(P[j][0],P[j][1]);g.lineTo(I[j][0],I[j][1]);g.lineTo(I[i][0],I[i][1]);g.closePath();g.fillStyle=i%2?"rgba(255,255,255,.3)":"rgba(0,0,0,.2)";g.fill()}
  path(I);g.fillStyle="rgba(255,255,255,.2)";g.fill();
  g.strokeStyle="rgba(255,255,255,.6)";g.lineWidth=1.2;path(P);g.stroke();path(I);g.stroke();
  const s=R*.24;g.save();g.translate(-R*.36,-R*.4);g.fillStyle="rgba(255,255,255,.95)";g.beginPath();g.moveTo(0,-s);g.quadraticCurveTo(0,0,s,0);g.quadraticCurveTo(0,0,0,s);g.quadraticCurveTo(0,0,-s,0);g.quadraticCurveTo(0,0,0,-s);g.fill();g.restore();
  g.restore();
}
const fl={},lcol={};
function isLiq(){return level%10!==0&&themeOf(0)===1}
function liquid(x,y,r,type,sq=1){
  const c=HUES[type%9];g.save();g.translate(x,y);
  g.shadowColor=hsl(c);g.shadowBlur=10;g.fillStyle=hsl(c,5);
  g.beginPath();g.arc(0,r*.2,r*.55,0,6.283);g.fill();
  g.beginPath();g.moveTo(-r*.5,r*.1);g.quadraticCurveTo(0,-r*.1,0,-r*.95);g.quadraticCurveTo(0,-r*.1,r*.5,r*.1);g.fill();
  g.shadowColor="transparent";g.fillStyle="rgba(255,255,255,.65)";g.beginPath();g.ellipse(-r*.2,r*.1,r*.1,r*.2,.3,0,6.283);g.fill();g.restore();
}
function drawLiquid(i,q,t,vis,T,dt){
  fl[i]=fl[i]===undefined?vis:fl[i]+(vis-fl[i])*Math.min(1,dt*9);
  const f=fl[i],lc=lcol[i]||(lcol[i]=[]);
  for(let k=0;k<t.length;k++)lc[k]=t[k];
  const x0=q.x-q.tw/2-2,w=q.tw+4,sl=q.slot,base=q.y+q.th-11;
  g.save();tubePath(q);g.clip();
  for(let k=0;k<Math.ceil(f-.001);k++){
    const fr=Math.min(1,f-k);if(fr<=0||lc[k]===undefined)break;
    const c=HUES[lc[k]],yb=base-sl*k+(k===0?14:0),h=sl*fr+(k===0?14:0)+1;
    const lg=g.createLinearGradient(x0,0,x0+w,0);lg.addColorStop(0,hsl(c,-16));lg.addColorStop(.3,hsl(c,12));lg.addColorStop(1,hsl(c,-12));
    g.fillStyle=lg;g.fillRect(x0,yb-h,w,h+.5);
  }
  if(f>.05){
    const yt=base-sl*f,amp=(sel===i?3:1.6);
    g.strokeStyle="rgba(255,255,255,.55)";g.lineWidth=2;g.beginPath();
    for(let x=x0;x<=x0+w;x+=3){const y=yt+Math.sin(x*.14+T*3+i)*amp;x===x0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
    g.fillStyle="rgba(255,255,255,.35)";
    for(let b=0;b<3;b++){const bx=q.x+Math.sin(T*.7+i+b*2.1)*q.tw*.22,by=base+8-((T*16+b*41+i*13)%(f*sl+8));g.beginPath();g.arc(bx,by,1.6+b*.5,0,6.283);g.fill()}

const hsl=(c,dl=0)=>`hsl(${c[0]} ${c[1]}% ${Math.max(5,Math.min(95,c[2]+dl))}%)`;
